<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design components | Rillatype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="intro">
      <div><h1>Fonts come first.</h1><p>Component preview for the monochrome Rillatype redesign.</p></div>
      <form class="search" action="components.html"><label for="search">Search fonts</label><div class="search-row"><input id="search" type="search" placeholder="A name or a style"><button class="button primary">Search</button></div></form>
    </section>
    <section class="section"><h2>Clear choices</h2><p class="muted">Buttons, inputs, and product previews share one visual system.</p>
      <p style="margin-block:24px"><button class="button primary">Browse fonts</button> <button class="button">Reset</button> <button class="button" disabled>Unavailable</button></p>
      <article class="product" style="max-width:420px"><a href="components.html"><div class="product-image"><img src="../previews/mango-1.jpg" width="1200" height="800" alt="Mango Letters font preview"></div><div class="product-info"><div><h3>Mango Letters</h3><p>Display font</p></div><span class="price">Demo $18</span></div></a></article>
    </section>
  </main>
</body>
</html>
