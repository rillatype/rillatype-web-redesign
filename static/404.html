<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Rillatype</title>
  <meta name="description" content="The page you're looking for doesn't exist. Browse our font collection instead.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🅡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 16px; line-height: 1.5;
      color: #1a1a1a; background: #fafaf8;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    :root {
      --coral: #e0553d;
      --charcoal: #1a1a1a;
      --text-muted: #8c8c88;
      --space-sm: 12px; --space-md: 16px; --space-lg: 24px;
      --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px;
    }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,250,248,.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-md) 0;
      max-width: 1200px; margin: 0 auto; padding-inline: var(--space-lg);
    }
    .site-logo { display: flex; align-items: center; }
    .site-logo__img { height: 38px; width: auto; display: block; }
    .nav-main ul { display: flex; gap: var(--space-sm); align-items: center; list-style: none; }
    .nav-main a {
      font-size: 14px; font-weight: 600; color: #2a2a2a;
      padding: 6px 10px; transition: color .2s;
    }
    .nav-main a:hover { color: var(--charcoal); }
    .nav-signin {
      font-size: 13px; font-weight: 700; color: #fff !important;
      background: var(--charcoal);
      padding: 7px 18px !important; border-radius: 50px;
      transition: background .2s !important;
    }
    .nav-signin:hover { background: var(--coral) !important; }

    /* Main */
    .error-page {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-3xl) var(--space-lg);
      text-align: center;
    }
    .error-content { max-width: 480px; }
    .error-code {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 400; line-height: 1;
      letter-spacing: -.04em;
      color: var(--coral);
      margin-bottom: var(--space-md);
    }
    .error-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700; letter-spacing: -.02em;
      margin-bottom: var(--space-sm);
    }
    .error-desc {
      font-size: 15px; color: var(--text-muted);
      margin-bottom: var(--space-xl);
      max-width: 360px; margin-inline: auto;
    }
    .error-actions {
      display: flex; gap: var(--space-md); align-items: center;
      justify-content: center; flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600;
      padding: 12px 28px; border-radius: 50px;
      transition: all .25s cubic-bezier(.16,1,.3,1);
    }
    .btn--primary {
      background: var(--charcoal); color: #fff;
    }
    .btn--primary:hover {
      background: var(--coral); transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(224,85,61,.25);
    }
    .btn--ghost {
      color: var(--text-muted);
    }
    .btn--ghost:hover {
      color: var(--charcoal);
    }

    /* Footer */
    .site-footer {
      padding: var(--space-xl) 0;
      border-top: 1px solid #e8e4e0;
      font-size: 14px; color: var(--text-muted);
    }
    .footer-inner {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: var(--space-md); align-items: center;
      max-width: 1200px; margin: 0 auto; padding-inline: var(--space-lg);
    }
    .footer-links { display: flex; gap: var(--space-lg); }
    .footer-links a { transition: color .2s; }
    .footer-links a:hover { color: var(--coral); }

    @media (max-width: 639px) {
      .nav-main ul { display: none; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="header-inner" aria-label="Main">
      <a href="/" class="site-logo"><img src="logo.png" alt="Rillatype" class="site-logo__img"></a>
      <div class="nav-main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/product-category/freebies/">Freebies</a></li>
          <li><a href="/contact/">Contact</a></li>
          <li><a href="sign-in.html" class="nav-signin">Sign In</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="error-page">
    <div class="error-content">
      <p class="error-code">404</p>
      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
      <div class="error-actions">
        <a href="/" class="btn btn--primary">Go home</a>
        <a href="/shop/" class="btn btn--ghost">Browse fonts</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="https://instagram.com/rillatype" rel="me">Instagram</a>
        <a href="/contact/">Contact</a>
        <a href="/font-license/">License</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </div>
      <p>&copy; 2026 Rillatype Studio</p>
    </div>
  </footer>

</body>
</html>
